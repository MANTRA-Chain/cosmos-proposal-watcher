[package]
name = "cosmos-proposal-watcher"
version = "0.1.1"
authors = ["Leo Pang <leo.pang@mantra.finance>"]
edition = "2021"

[[bin]]
name = "proposal-watcher"
path = "src/bin/main.rs"

[dependencies]
structopt = "0.3"
serde_derive = "1.0.226"
humantime-serde = "1.1.1"
anyhow = "1.0.100"
tower = "0.5.2"
http = "1.3"
prost = "0.14.1"
prost-types = "0.14.1"
tonic = { version = "0.13", features = ["tls-native-roots", "tls-webpki-roots"] }
tokio = { version = "1.47.1", features = ["full"] }
futures = { version = "0.3", default-features = false }
env_logger = "0.11.8"
log = "0.4.28"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
flex-error = { version = "0.4.4", default-features = false }
chrono = "0.4"
itertools = "0.14.0"
slack-hook = "0.9.1"
toml = "0.9.7"
tracing = "0.1.41"
cosmos-sdk-proto = "0.27.0"
enum-iterator = "2.3.0"
tendermint-rpc = { version = "=0.40.4", features = ["http-client"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3.20", features = [ "env-filter", "fmt" ] }
test-log = { version = "0.2.18", features = ["trace"] }
actix-rt = "2.11.0"
more-asserts = "0.3.1"
